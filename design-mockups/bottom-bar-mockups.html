<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bottom Bar Mockups</title>
  <style>
    :root {
      --bg0: #05070b;
      --bg1: #0a1222;
      --bg2: #122136;
      --line: rgba(255, 255, 255, 0.08);
      --text: #d7deea;
      --muted: #8594ad;
      --accent: #2ff0d1;
      --accent2: #4f7cff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 10% -10%, #21385f 0%, transparent 60%),
        radial-gradient(900px 600px at 90% 120%, #132a42 0%, transparent 65%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 50%, var(--bg2));
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .row {
      width: min(1250px, 100%);
      display: grid;
      grid-template-columns: repeat(3, minmax(280px, 1fr));
      gap: 20px;
    }

    .phone {
      border-radius: 36px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      padding: 16px 14px 18px;
      position: relative;
      overflow: hidden;
      height: 640px;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(420px 180px at 50% 106%, rgba(47, 240, 209, 0.11), transparent 70%),
        radial-gradient(260px 130px at 48% 4%, rgba(79, 124, 255, 0.18), transparent 72%);
    }

    .title {
      position: absolute;
      left: 18px;
      top: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      z-index: 2;
    }

    .content {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 50px;
      bottom: 98px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
    }

    .chips {
      display: flex;
      gap: 8px;
      position: absolute;
      top: 68px;
      left: 28px;
      z-index: 2;
    }

    .chip {
      height: 30px;
      border-radius: 999px;
      padding: 0 14px;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: #b8c6da;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(8, 14, 24, 0.5);
    }

    .bar-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      display: grid;
      place-items: center;
      z-index: 3;
    }

    .bar {
      width: 86%;
      height: 70px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 14px;
    }

    .ico {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #9eb0c7;
      font-size: 18px;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .ico.active {
      color: #0b1b2e;
      font-weight: 700;
    }

    .ico span { transform: translateY(-1px); }

    /* Variant A: Frost Glass */
    .a .bar {
      background: linear-gradient(180deg, rgba(23, 34, 52, 0.72), rgba(12, 20, 32, 0.9));
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
    }
    .a .ico.active {
      background: linear-gradient(145deg, #4cf6d9, #18c3d8);
      box-shadow: 0 6px 16px rgba(47, 240, 209, 0.4);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Variant B: Neon Rail */
    .b .bar {
      background: linear-gradient(180deg, rgba(10, 16, 28, 0.95), rgba(8, 12, 20, 0.98));
      border-color: rgba(79, 124, 255, 0.35);
      box-shadow:
        0 18px 40px rgba(10, 15, 26, 0.66),
        0 0 0 1px rgba(79, 124, 255, 0.15),
        0 0 24px rgba(79, 124, 255, 0.25);
    }
    .b .bar::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 8px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, #2ff0d1, #4f7cff, #2ff0d1);
      opacity: 0.75;
    }
    .b .ico.active {
      background: linear-gradient(145deg, #4f7cff, #7d5dff);
      color: #ebf1ff;
      box-shadow: 0 8px 20px rgba(79, 124, 255, 0.45);
    }

    /* Variant C: Center Lift */
    .c .bar {
      height: 76px;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(12, 20, 32, 0.97), rgba(7, 12, 20, 0.98));
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      padding: 0 20px;
    }
    .c .ico.center {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      margin-top: -28px;
      background: linear-gradient(145deg, #2ff0d1, #4f7cff);
      color: #03152b;
      font-weight: 800;
      box-shadow:
        0 14px 24px rgba(47, 240, 209, 0.3),
        0 0 0 6px rgba(10, 16, 28, 0.75);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .c .ico.active:not(.center) {
      background: rgba(255, 255, 255, 0.07);
      color: #e6efff;
      border-color: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <div class="row">
    <section class="phone a" id="mock-a">
      <div class="title">Varyant A / Frost Glass</div>
      <div class="content"></div>
      <div class="chips">
        <div class="chip">Trend</div>
        <div class="chip">Aksiyon</div>
        <div class="chip">Belgesel</div>
      </div>
      <div class="bar-wrap">
        <nav class="bar">
          <div class="ico"><span>◻</span></div>
          <div class="ico active"><span>◆</span></div>
          <div class="ico"><span>●</span></div>
          <div class="ico"><span>✦</span></div>
          <div class="ico"><span>☰</span></div>
        </nav>
      </div>
    </section>

    <section class="phone b" id="mock-b">
      <div class="title">Varyant B / Neon Rail</div>
      <div class="content"></div>
      <div class="chips">
        <div class="chip">Canlı TV</div>
        <div class="chip">Yeni</div>
        <div class="chip">Top 10</div>
      </div>
      <div class="bar-wrap">
        <nav class="bar">
          <div class="ico"><span>◻</span></div>
          <div class="ico"><span>◆</span></div>
          <div class="ico active"><span>●</span></div>
          <div class="ico"><span>✦</span></div>
          <div class="ico"><span>☰</span></div>
        </nav>
      </div>
    </section>

    <section class="phone c" id="mock-c">
      <div class="title">Varyant C / Center Lift</div>
      <div class="content"></div>
      <div class="chips">
        <div class="chip">Film</div>
        <div class="chip">Dizi</div>
        <div class="chip">Spor</div>
      </div>
      <div class="bar-wrap">
        <nav class="bar">
          <div class="ico active"><span>◻</span></div>
          <div class="ico"><span>◆</span></div>
          <div class="ico center"><span>●</span></div>
          <div class="ico"><span>✦</span></div>
          <div class="ico"><span>☰</span></div>
        </nav>
      </div>
    </section>
  </div>
</body>
</html>
