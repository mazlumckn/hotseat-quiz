<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Cinematic – Your Personal Cinema</title>
  <meta name="description" content="Your personal cinema is ready for its first premiere. Start exploring our collection to build your library." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ── Header ── -->
    <header class="header" id="main-header">
      <div class="logo">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">CINEMATIC</span>
      </div>
      <button class="icon-btn" id="search-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </header>

    <!-- ── Main ── -->
    <main class="main-content" id="main-content">

      <!-- Hero -->
      <section class="hero-section">
        <div class="badge">DIGITAL CURATOR</div>

        <h1 class="hero-title">The Stage<br/><span class="hero-title-dim">is Quiet.</span></h1>

        <p class="hero-subtitle">
          Your personal cinema is ready for its first premiere. Start exploring our collection to build your library.
        </p>

        <div class="hero-actions">
          <button class="btn btn-primary" id="browse-btn">Browse Movies</button>
          <button class="btn btn-secondary" id="add-content-btn">Add Content</button>
        </div>
      </section>

      <!-- Cards -->
      <section class="cards-section">

        <!-- Top row -->
        <div class="cards-top-row">

          <!-- Cinema Hall Card -->
          <div class="card card-cinema" id="card-cinema">
            <div class="cinema-inner">
              <!-- Film strip left edge -->
              <div class="film-strip film-strip-left">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <!-- Seats -->
              <div class="seats-wrapper">
                <div class="seat-row seat-row-1">
                  <div class="seat"></div><div class="seat"></div><div class="seat"></div>
                  <div class="seat"></div><div class="seat"></div>
                </div>
                <div class="seat-row seat-row-2">
                  <div class="seat"></div><div class="seat"></div><div class="seat"></div>
                  <div class="seat"></div><div class="seat"></div>
                </div>
                <div class="seat-row seat-row-3">
                  <div class="seat"></div><div class="seat"></div><div class="seat"></div>
                  <div class="seat"></div><div class="seat"></div>
                </div>
              </div>
              <!-- Film strip right edge -->
              <div class="film-strip film-strip-right">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <!-- Screen glow at bottom -->
              <div class="screen-glow"></div>
            </div>
          </div>

          <!-- Clapper Card -->
          <div class="card card-clapper" id="card-clapper">
            <div class="card-center">
              <!-- Clapperboard icon matching reference -->
              <svg width="34" height="32" viewBox="0 0 36 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Body -->
                <rect x="2" y="10" width="32" height="22" rx="2.5" fill="none" stroke="#5a5a70" stroke-width="1.6"/>
                <!-- Top bar -->
                <rect x="2" y="6" width="32" height="5" rx="1.5" fill="none" stroke="#5a5a70" stroke-width="1.6"/>
                <!-- Diagonal stripes on top bar -->
                <line x1="8"  y1="6" x2="5"  y2="11" stroke="#5a5a70" stroke-width="1.4"/>
                <line x1="14" y1="6" x2="11" y2="11" stroke="#5a5a70" stroke-width="1.4"/>
                <line x1="20" y1="6" x2="17" y2="11" stroke="#5a5a70" stroke-width="1.4"/>
                <line x1="26" y1="6" x2="23" y2="11" stroke="#5a5a70" stroke-width="1.4"/>
                <line x1="32" y1="6" x2="29" y2="11" stroke="#5a5a70" stroke-width="1.4"/>
                <!-- Vertical + horizontal lines inside body -->
                <line x1="10" y1="10" x2="10" y2="32" stroke="#5a5a70" stroke-width="1.4"/>
                <line x1="26" y1="10" x2="26" y2="32" stroke="#5a5a70" stroke-width="1.4"/>
                <line x1="2"  y1="21" x2="34" y2="21" stroke="#5a5a70" stroke-width="1.4"/>
              </svg>
            </div>
          </div>

        </div>

        <!-- Bottom wide card -->
        <div class="card card-wide" id="card-wide">
          <div class="card-center">
            <div class="sparkle-group">
              <span class="sp sp-main">✦</span>
              <span class="sp sp-sm-tl">✦</span>
              <span class="sp sp-sm-br">✦</span>
            </div>
          </div>
        </div>

      </section>
    </main>

    <!-- ── Bottom Nav ── -->
    <nav class="bottom-nav" id="bottom-nav">

      <!-- 1. Home -->
      <button class="nav-btn active" id="nav-home" data-tab="home" aria-label="Home">
        <canvas id="home-icon-canvas" width="126" height="126" class="home-canvas-icon"></canvas>
      </button>

      <!-- 2. Movies / Film -->
      <button class="nav-btn" id="nav-movies" data-tab="movies" aria-label="Movies">
        <canvas id="movies-icon-canvas" width="126" height="126" class="home-canvas-icon"></canvas>
      </button>

      <!-- 3. Center Add -->
      <button class="nav-btn nav-center-btn" id="nav-add" data-tab="add" aria-label="Add">
        <canvas id="center-icon-canvas" width="126" height="126" class="home-canvas-icon"></canvas>
      </button>

      <!-- 4. Library -->
      <button class="nav-btn" id="nav-library" data-tab="library" aria-label="Library">
        <canvas id="library-icon-canvas" width="126" height="126" class="home-canvas-icon"></canvas>
      </button>

      <!-- 5. Profile -->
      <button class="nav-btn" id="nav-profile" data-tab="profile" aria-label="Profile">
        <canvas id="profile-icon-canvas" width="126" height="126" class="home-canvas-icon"></canvas>
      </button>

    </nav>
  </div>

  <!-- Search Overlay -->
  <div class="search-overlay" id="search-overlay">
    <div class="search-overlay-inner">
      <div class="search-bar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search movies, series, shows…" autocomplete="off"/>
        <button class="search-close" id="search-close-btn">✕</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
